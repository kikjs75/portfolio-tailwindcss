<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- 1) 구글링 'font awesome cdn' 2) 'all.min.css' 링크 복사 -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header class="sticky top-0 opacity-90 backdrop-blur-lg">
      <nav
        class="container max-w-4xl mx-auto px-6 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-4">
          <h1 class="text-2xl font-bold">김개발</h1>
          <p class="text-sm text-gray-500">풀스택 개발자</p>
        </div>
        <div class="flex items-center gap-x-6">
          <a href="#home" class="hover:text-blue-500 transition-colors">홈</a>

          <a href="#about" class="hover:text-blue-500 transition-colors"
            >소개</a
          >
          <a href="#skills" class="hover:text-blue-500 transition-colors"
            >기술</a
          >
          <a href="#projects" class="hover:text-blue-500 transition-colors"
            >프로젝트</a
          >
          <a href="#contact" class="hover:text-blue-500 transition-colors"
            >연락처</a
          >
          <button
            class="p-2 w-10 h-10 rounded-full bg-gray-200 focus:outline-none focus:ring focus:ring-blue-500"
          >
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </nav>
    </header>
    <main class="container max-w-4xl mx-auto px-6 py-12">
      <!-- Home Section -->
      <!-- 1) 구글링 'dicebear' 검색 후 dicebear 홈피 접속 2) 'Try Playgroud' 선택 3) 캐릭터 선택하고 이미지 태그 링크 복사 -->
      <section id="home" class="flex items-center justify-between mb-12">
        <div class="shrink-0 mr-10">
          <img
            src="https://api.dicebear.com/9.x/fun-emoji/svg?seed=Jade"
            alt="avatar"
            class="w-56 h-56 rounded-full border-2 object-cover"
          />
        </div>
        <div class="text-right">
          <h1 class="text-4xl font-bold mb-2">김개발</h1>
          <p class="text-xl mb-4">풀스택 개발자</p>
          <p class="text-gray-600">
            5년 이상의 경력을 가진 열정적인 풀스택 개발자입니다. 확장 가능한 웹
            애플리케이션 구축에 전문성을 갖추고 있으며, 최신 JavaScript
            프레임워크와 클라우드 기술에 대한 전문 지식을 보유하고 있습니다.
            항상 새로운 도전과 학습을 즐깁니다.
          </p>
        </div>
      </section>

      <!-- About Section -->
      <section class="bg-yellow-200 h-60">소개</section>

      <!-- Skills Section -->
      <section class="bg-blue-200 h-60">기술</section>

      <!-- Projects Section -->
      <section class="bg-cyan-200 h-60">프로젝트</section>

      <!-- Contact Section -->
      <section class="bg-green-200 h-60">연락처</section>
    </main>
    <footer class="bg-gray-400 w-full h-20"></footer>
  </body>
</html>
